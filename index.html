<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investiert einfach.</title>
  <meta name="description" content="Hier entsteht etwas Neues – der neue Internetauftritt von Jannik Siever." />
  <style>
    :root {
      --bg: #f7f3ee;
      --text: #262626;
      --muted: #6f675f;
      --gold: #b48a3a;
      --gold-light: #d3b072;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      position: relative;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.75)),
        radial-gradient(circle at 80% 75%, rgba(212,176,114,0.22), transparent 28%),
        linear-gradient(135deg, #faf8f5 0%, #f4eee7 55%, #efe7de 100%);
    }

    .left {
      padding: 48px 56px 48px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 30px;
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 32px;
    }

    .bars span {
      display: block;
      width: 12px;
      background: var(--gold);
      border-radius: 1px;
    }

    .bars span:nth-child(1) { height: 10px; }
    .bars span:nth-child(2) { height: 17px; }
    .bars span:nth-child(3) { height: 24px; }
    .bars span:nth-child(4) { height: 31px; }

    .divider {
      width: 1px;
      height: 36px;
      background: rgba(38,38,38,0.35);
    }

    .brand-name {
      font-size: 1.15rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .hero {
      max-width: 680px;
      margin-top: 20px;
    }

    .hero h1 {
      font-size: clamp(3rem, 6vw, 5.6rem);
      line-height: 0.95;
      font-weight: 500;
      margin: 0 0 28px 0;
    }

    .gold-line {
      width: 72px;
      height: 3px;
      background: var(--gold);
      margin: 0 0 28px 0;
    }

    .sub {
      font-size: clamp(1.15rem, 2vw, 1.7rem);
      line-height: 1.45;
      color: #3d3d3d;
      max-width: 620px;
      margin-bottom: 42px;
    }

    .claim {
      font-size: clamp(1.15rem, 1.7vw, 1.8rem);
      color: var(--gold);
      font-style: italic;
      line-height: 1.5;
    }

    .contact {
      margin-top: 48px;
      font-size: 1.05rem;
      color: var(--text);
    }

    .contact a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid rgba(38,38,38,0.2);
    }

    .contact a:hover {
      border-bottom-color: var(--gold);
    }

    .right {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    .arch {
      position: absolute;
      inset: 0;
      border-top-left-radius: 220px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.04)),
        linear-gradient(180deg, #b99567 0%, #a97e4d 100%);
      clip-path: ellipse(92% 88% at 100% 50%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
    }

    .scene {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 78% 65%, rgba(255, 239, 205, 0.95), rgba(255, 226, 170, 0.2) 18%, transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,0.0) 0%, rgba(255,255,255,0.0) 58%, rgba(255,255,255,0.3) 100%);
    }

    .horizon {
      position: absolute;
      left: 7%;
      right: 0;
      bottom: 18%;
      height: 28%;
      background:
        linear-gradient(180deg, rgba(180,138,58,0.04), rgba(180,138,58,0.0)),
        linear-gradient( to top, rgba(120,105,95,0.28), rgba(120,105,95,0.0) 70%);
      clip-path: polygon(0% 85%, 10% 72%, 20% 78%, 33% 58%, 48% 69%, 64% 46%, 77% 55%, 100% 28%, 100% 100%, 0 100%);
      opacity: 0.75;
    }

    .terrace {
      position: absolute;
      right: -8%;
      bottom: 0;
      width: 88%;
      height: 44%;
      border-top-left-radius: 420px 220px;
      background:
        linear-gradient(180deg, #f2ede7 0%, #ddd1c3 100%);
      box-shadow:
        inset 0 0 0 1px rgba(100,80,50,0.08),
        0 -20px 40px rgba(0,0,0,0.04);
    }

    .terrace::before {
      content: "";
      position: absolute;
      left: 12%;
      top: 18%;
      width: 70%;
      height: 42%;
      border-top-left-radius: 280px 130px;
      border: 9px solid rgba(184,138,58,0.55);
      border-right: none;
      border-bottom: none;
      transform: rotate(2deg);
      opacity: 0.85;
    }

    .steps {
      position: absolute;
      right: 4%;
      bottom: 13%;
      width: 32%;
      height: 28%;
      background:
        repeating-linear-gradient(
          to bottom,
          #eadfce 0px,
          #eadfce 18px,
          #cfbda8 18px,
          #cfbda8 22px
        );
      clip-path: polygon(35% 0, 100% 0, 100% 100%, 0 100%);
      opacity: 0.9;
    }

    .footer-note {
      position: absolute;
      bottom: 24px;
      right: 28px;
      font-family: Arial, sans-serif;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.72);
      letter-spacing: 0.04em;
    }

    @media (max-width: 980px) {
      .page {
        grid-template-columns: 1fr;
      }

      .right {
        min-height: 360px;
      }

      .left {
        padding: 34px 26px 24px 26px;
      }

      .hero h1 {
        font-size: 3.4rem;
      }

      .sub {
        font-size: 1.15rem;
      }

      .claim {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="left">
      <div>
        <div class="brand">
          <div class="bars" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="divider"></div>
          <div class="brand-name">Investiert Einfach.</div>
        </div>

        <div class="hero">
          <h1>Hier entsteht<br>etwas Neues&nbsp;…</h1>
          <div class="gold-line"></div>
          <div class="sub">
            Der neue Internetauftritt von Jannik Siever ist bald für Sie da.
          </div>
          <div class="claim">
            Vorsorge. Investments. Persönliche Beratung.
          </div>
        </div>
      </div>

      <div class="contact">
        Kontakt:
        <a href="mailto:jannik@investiert-einfach.de">jannik@investiert-einfach.de</a>
      </div>
    </section>

    <section class="right" aria-hidden="true">
      <div class="arch"></div>
      <div class="scene"></div>
      <div class="horizon"></div>
      <div class="terrace"></div>
      <div class="steps"></div>
      <div class="footer-note">Website im Aufbau</div>
    </section>
  </main>
</body>
</html>
